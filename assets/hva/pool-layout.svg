<svg width="1080" height="560" viewBox="0 0 1080 560" xmlns="http://www.w3.org/2000/svg">
  <style>
    text{font-family:Inter,Arial,Helvetica,sans-serif;}
    .title{font-size:22px;font-weight:700;fill:#002366;}
    .sub{font-size:13px;font-weight:500;fill:#4a5568;}
    .region{font-size:16px;font-weight:700;fill:#002366;}
    .region2{font-size:12px;font-weight:500;fill:#2d3748;}
    .edge{font-size:13px;font-weight:700;fill:#002366;letter-spacing:.4px;}
    .small{font-size:11px;font-weight:500;fill:#4a5568;}
    .tag{font-size:11px;font-weight:700;fill:#002366;}
    .redtxt{font-size:13px;font-weight:700;fill:#fff;letter-spacing:.4px;}
    .redsub{font-size:10.5px;font-weight:600;fill:#ffd9db;}
    .seat{font-size:12px;font-weight:700;fill:#7a5a12;letter-spacing:.4px;}
    .seatsub{font-size:10px;font-weight:500;fill:#7a5a12;}
    .footb{font-size:11.5px;font-weight:700;fill:#b81e24;}
    .ghost{font-size:10px;font-weight:600;fill:#8a94a6;}
  </style>
  <rect x="0" y="0" width="1080" height="560" fill="#fff"/>
  <defs>
    <marker id="arL" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#002366"/></marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#002366"/></marker>
  </defs>

  <!-- header -->
  <text x="30" y="34" class="title">Hampton Virginia Aquaplex &#8212; Meet Configuration</text>
  <text x="30" y="56" class="sub">Plan view. Diving-board (left) end = warm-up/warm-down; competition starts at the right end; two center bulkheads = turn end.</text>

  <!-- ===== TOP seating (long side) : left portion no-photo during 25s, right portion OK ===== -->
  <!-- left portion: no photos during 25s -->
  <rect x="165" y="92" width="375" height="48" fill="#d9242b"/>
  <text x="352" y="112" class="redtxt" text-anchor="middle">SEATING &#8212; NO PHOTOS / VIDEO during the 25s</text>
  <text x="352" y="130" class="redsub" text-anchor="middle">diagonal view behind the bulkhead starts</text>
  <!-- right portion: photos OK -->
  <rect x="540" y="92" width="455" height="48" fill="#f2dfa8" stroke="#c9a24b" stroke-width="2"/>
  <text x="767" y="112" class="seat" text-anchor="middle">SPECTATOR SEATING</text>
  <text x="767" y="130" class="seatsub" text-anchor="middle">side-on view of the races &#183; photos OK</text>

  <!-- ===== POOL ===== -->
  <rect x="165" y="150" width="750" height="310" fill="#e8f4fb" stroke="#002366" stroke-width="3"/>

  <!-- diving boards ghost (left end, deck over water) -->
  <g opacity="0.5">
    <rect x="150" y="243" width="120" height="9" rx="2" fill="#b7c0cf"/>
    <rect x="150" y="300" width="120" height="9" rx="2" fill="#b7c0cf"/>
  </g>
  <text x="212" y="336" class="ghost" text-anchor="middle">diving boards</text>

  <!-- warm-up (left half): vertical lanes -->
  <g stroke="#9cc4e0" stroke-width="1.5">
    <line x1="300" y1="150" x2="300" y2="460"/>
    <line x1="345" y1="150" x2="345" y2="460"/>
    <line x1="390" y1="150" x2="390" y2="460"/>
    <line x1="435" y1="150" x2="435" y2="460"/>
    <line x1="480" y1="150" x2="480" y2="460"/>
  </g>
  <text x="400" y="200" class="region" text-anchor="middle">WARM-UP /</text>
  <text x="400" y="220" class="region" text-anchor="middle">WARM-DOWN</text>
  <text x="400" y="238" class="region2" text-anchor="middle">diving-board end</text>

  <!-- bulkheads (center, pushed together, turn end) -->
  <rect x="527" y="150" width="8" height="310" fill="#6b7280"/>
  <rect x="537" y="150" width="8" height="310" fill="#6b7280"/>
  <text x="536" y="474" class="small" text-anchor="middle">bulkheads (turn end)</text>

  <!-- competition (right half): horizontal lanes -->
  <g stroke="#9cc4e0" stroke-width="1.5">
    <line x1="552" y1="190" x2="900" y2="190"/>
    <line x1="552" y1="228" x2="900" y2="228"/>
    <line x1="552" y1="266" x2="900" y2="266"/>
    <line x1="552" y1="304" x2="900" y2="304"/>
    <line x1="552" y1="342" x2="900" y2="342"/>
    <line x1="552" y1="380" x2="900" y2="380"/>
  </g>
  <!-- starting blocks at competition (right) end wall -->
  <g fill="#002366">
    <rect x="899" y="164" width="14" height="14" rx="2"/>
    <rect x="899" y="202" width="14" height="14" rx="2"/>
    <rect x="899" y="240" width="14" height="14" rx="2"/>
    <rect x="899" y="278" width="14" height="14" rx="2"/>
    <rect x="899" y="316" width="14" height="14" rx="2"/>
    <rect x="899" y="354" width="14" height="14" rx="2"/>
    <rect x="899" y="392" width="14" height="14" rx="2"/>
  </g>
  <text x="730" y="285" class="region" text-anchor="middle">COMPETITION COURSE</text>
  <text x="730" y="303" class="region2" text-anchor="middle">Pool A &#183; start at the right end</text>

  <!-- race direction arrows -->
  <line x1="893" y1="430" x2="560" y2="430" stroke="#002366" stroke-width="2" marker-end="url(#arL)"/>
  <text x="726" y="425" class="small" text-anchor="middle">50s &amp; longer: start right &#8592; turn at bulkhead</text>
  <line x1="552" y1="168" x2="885" y2="168" stroke="#002366" stroke-width="2" marker-end="url(#arR)"/>
  <text x="720" y="163" class="small" text-anchor="middle">25s: start at bulkhead &#8594;</text>

  <!-- ===== RIGHT end-seating : no photos for 50s & longer ===== -->
  <rect x="925" y="92" width="80" height="368" fill="#d9242b"/>
  <text x="965" y="276" class="redtxt" text-anchor="middle" transform="rotate(90 965 276)">SEATING &#8212; NO PHOTOS / VIDEO for 50s &amp; longer</text>
  <text x="946" y="276" class="redsub" text-anchor="middle" transform="rotate(90 946 276)">directly behind the starting blocks</text>

  <!-- ===== bottom: far-side deck ===== -->
  <text x="540" y="500" class="edge" text-anchor="middle">POOL DECK (far side) &#8212; officials, coaches &amp; swimmers only</text>

  <!-- footnote -->
  <line x1="30" y1="522" x2="1050" y2="522" stroke="#e2e8f0" stroke-width="1"/>
  <text x="30" y="543" class="footb">No photos or video from behind the starting blocks &#8212; the no-photo seating changes with the event: the right-end seating for 50s &amp; longer, the left of the top seating during the 25s.</text>
</svg>
